networks:
  prod_network:
    driver: bridge

services:
  <SERVICE_NAME_HERE>:
    image: <IMGAE_HERE>
    container_name: <CONTENER_NAME_HERE>
    ports:
      - "8000:8000" # Dev API exposed on port 8000
    env_file:
      - .env.prod
    environment:
      NEW_RELIC_CONFIG_FILE: /app/newrelic.ini
      NEW_RELIC_ENVIRONMENT: development 
      NEW_RELIC_APP_NAME: backend
      NEW_RELIC_LOG_LEVEL: info
    restart: unless-stopped
    networks:
      - prod_network # Attach to the custom network
